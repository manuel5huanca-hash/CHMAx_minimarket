{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3>Nuevo Producto</h3>
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="nombre" placeholder="Nombre" class="form-control mb-3" required>
        <input type="number" step="0.01" name="precio" placeholder="Precio" class="form-control mb-3" required>
        <input type="number" name="stock" placeholder="Stock" class="form-control mb-3" required>
        <input type="text" name="categoria" placeholder="Categoría" class="form-control mb-3" required>

        <!-- Campo para subir imagen -->
        <input type="file" name="imagen" class="form-control mb-3" accept="image/*">

        <button type="submit" class="btn btn-success">Guardar</button>
        <!-- Botón de volver -->
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Volver</a>
    </form>
</div>
{% endblock %}
