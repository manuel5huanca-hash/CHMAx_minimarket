{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3>Editar Producto</h3>
    <form method="POST">
        <input type="text" name="nombre" value="{{ producto.nombre }}" class="form-control mb-3" required>
        <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" class="form-control mb-3" required>
        <input type="number" name="stock" value="{{ producto.stock }}" class="form-control mb-3" required>
        <input type="text" name="categoria" value="{{ producto.categoria }}" class="form-control mb-3" required>
        <input type="text" name="imagen" value="{{ producto.imagen }}" class="form-control mb-3">
        <button type="submit" class="btn btn-primary">Actualizar</button>
    </form>
</div>
{% endblock %}
